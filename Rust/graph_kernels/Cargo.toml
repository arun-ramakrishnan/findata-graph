[package]
name = "graph_kernels"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"  # repo root LICENSE; first-party crate

[lib]
name = "graph_kernels"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.30", features = ["extension-module", "abi3-py39"] }
numpy = "0.30"
rayon = "1.10"

[dev-dependencies]
proptest = "1"
