[package]
name = "cosine_knn"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "trial"
path = "src/bin/trial.rs"

[[bench]]
name = "divan_bench"
path = "benches/divan_bench.rs"
harness = false

[lib]
name = "cosine_knn"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.30", features = ["extension-module", "abi3-py39"] }
numpy = "0.30"
rayon = "1.10"

[dev-dependencies]
divan = "0.1"
