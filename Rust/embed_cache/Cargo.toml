[package]
name = "embed_cache"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "trial"
path = "src/bin/trial.rs"

[[bin]]
name = "sha_s2"
path = "src/bin/sha_s2.rs"

[[bin]]
name = "embed-cache-lookup"
path = "src/bin/embed-cache-lookup.rs"

[lib]
name = "embed_cache"
path = "src/lib.rs"

[dependencies]
sha2 = { version = "0.10", features = ["asm"] }
openssl = "0.10"
rusqlite = { version = "0.33", features = ["bundled"] }
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
