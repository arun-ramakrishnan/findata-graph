[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
# 'live' tests need the real memory/research.db + findata/ vault and are
# deselected by `make qa` / `make test` (-m "not live"); run with
# `make test-live` or in CI against a restored snapshot.
#
# NOTE (2026-08-14): the `slow` marker was REMOVED. Its only users were 13
# wall-clock budget tests in tests/test_performance.py that duplicated
# `make perf` (tests/run_perf_benchmarks.py) with looser budgets and never
# ran under qa; they were folded into the benchmark runner. Wall-clock
# budgets live ONLY in `make perf` now. Complexity-class guards (time-RATIO
# scaling tests) stayed in test_performance.py, unmarked, in the default
# gate. If you reintroduce a slow test, declare the marker here first
# (--strict-markers makes undeclared ones an error) and select it
# explicitly the way perf/integration do.
markers =
    live: hits the real memory/research.db / findata vault
    integration: end-to-end cross-component pipeline tests (run explicitly)
addopts = -ra --strict-markers --hypothesis-seed=0
# --hypothesis-seed=0 pins Hypothesis to a deterministic RNG so `make qa` /
# `make test` (which run the test_fuzz_* suite) don't flap run-to-run. Any int
# pins it; 0 is just the chosen value. To explore with a fresh/random seed for
# a one-off bug hunt, override on the CLI: `pytest --hypothesis-seed=<n>` (or
# drop the flag via `pytest -o addopts=""` to go fully random).
# Keep temp dirs only for failed tests; cleanup passing tests automatically
tmp_path_retention_policy = failed
tmp_path_retention_count = 1
