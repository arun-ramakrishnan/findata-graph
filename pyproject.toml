[project]
name = "findata-knowledge-graph"
version = "0.2.0"
description = "FinData knowledge graph: SQLite + DuckDB graph layer and Flask API over a parsed newsletter/markdown corpus."
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.14"

# Runtime dependencies — migrated from requirements.txt (2026-08-13).
# Kept unpinned to match the previous requirements.txt convention; the
# `make qa` dependency-pinning advisory still nudges toward == pins.
dependencies = [
    # Flask web API (app.py).
    "Flask",
    "markupsafe",
    # .env loading.
    "python-dotenv",
    # Werkzeug (WSGI / dev server).
    "Werkzeug",
    # Production WSGI server.
    "gunicorn",
    # Ticker data (helpers/core/get_tickers.py).
    "yfinance",
    # SQLite spellfix extension (helpers/core/db.py).
    "sqlite-spellfix",
    # YAML front-matter parsing in helpers/validators/verify_notes.py and the
    # maintenance scripts. Not pulled in transitively by any other declared
    # dependency, so must be declared explicitly.
    "PyYAML",
    # Graph query + algorithm layer (helpers/graph/{query,onager,algorithms}.py).
    # The Onager graph-algorithm extension (Apache-2.0, DuckDB community repo)
    # is installed at runtime via INSTALL onager FROM community — see
    # doc/design/graph_design.md. duckpgq and NetworkX were retired 2026-08-14;
    # duckdb itself is unpinned (decision D8).
    "duckdb",
    # Parquet/Arrow I/O (helpers/maintenance/snapshot_db.py).
    "pyarrow",
    # Numeric kernels for the aligned f32 embedding matrix (S2b,
    # helpers/core/embed_matrix.py — corpus_embeddings_scaling proposal
    # 2026-09-02). Was transitively available (max/pandas) but is now
    # imported directly by production code, so it is declared.
    "numpy",
    # PDF pipeline (helpers/pdf/pdf_conv_md.py + helpers/pdf/pdf_local.py):
    # requests for write_outputs' remote-URL image branch; pymupdf4llm for the
    # local no-OCR engine (default, local-first per operator decision 2026-08-26).
    # indra-ocr (CPU-only in-process ONNX Runtime) is the scanned OCR fallback
    # (rung 2) and teleocr (TeleOCR GGUF via llama-server) the terminal rung,
    # per the pdf_engine_indra_ocr_rung2 proposal (lite Tesseract cut
    # 2026-10-26; before that: Paddle API cut, pix2text removed 2026-10-06).
    # liteparse stays for its no-OCR bbox sidecar module (no chain flags).
    "requests",
    "pymupdf4llm",
    "pymupdf", # imported directly (Pixmap/text-layer guard), not just transitively
    "indra-ocr",
    "liteparse",
    # sqlite-vec vector index for note_search hybrid ranking (A1,
    # helpers/core/vec_search.py). Loaded per-connection exactly like
    # sqlite-spellfix above; KNN degrades to a Python cosine fallback when
    # the extension is unavailable.
    "sqlite-vec",
    # JSON-Schema validation of findata note frontmatter (
    # helpers/validators/frontmatter_schema.py; schemas in doc/okf/).
    "jsonschema",
    # Fast validation engine, default everywhere; --strict opts into
    # jsonschema (fastjsonschema_split_track: 431us -> 25us per note,
    # verdict-identical, fail-fast single error).
    "fastjsonschema",
    # Local embedding backend (helpers/core/local_embedder.py): bge-small-en-v1.5
    # GGUF via llama.cpp, CPU-only, no torch. Built from sdist on first install
    # (gcc/cmake needed); the model file itself is gitignored under models/.
    "llama-cpp-python",
    # Binary msgpack transport (helpers/core/msgpackio.py — internal
    # transport shim S1; helpers/graph/extract_relations.py — Edge/Unresolved
    # msgspec.Struct classes). Imported directly, not transitively, so declared.
    "msgspec",
    # Google Finance and Sheets API
    "gspread",
    # FinnHub API
    "finnhub-python",
    # NSE Integrated Filing XBRL client (helpers/maintenance/ingest_nse_xbrl.py).
    # Installed but transitively available; imported directly, so declared.
    "nse-xbrl",
    # TMX issuer-directory xlsx parsing (helpers/maintenance/exchange_sync.py
    # ingest_tmx). Imported lazily in-lane; declared so types/deptry resolve.
    "openpyxl",
    # Mojo regex bridge (Mojo/bench/mojo_regex_*.py + Mojo/src via Python
    # `regex` interop) — active Mojo code uses `import regex`, so runtime.
    "regex",
    # Second dyadic graph engine (helpers/graph/igraph_bridge.py, restored
    # D17 2026-09-26): GPL-2.0-or-later is integration-clean under the
    # AGPL-3.0-or-later repo license — the D14/D16 pilot-venv split is
    # retired. Covers Leiden, weighted centralities, weighted shortest
    # path, maxflow/mincut where Onager is unweighted-only or absent.
    # Eval: doc/local/evaluations/graph_layer.md.
    "igraph",
    # Hypergraph analytics tier (helpers/graph/hyper_communities.py —
    # hypergraph_incidence_hyx proposal 2026-09-13): hy-MMSBM overlapping
    # communities over the hyper_edges/hyper_incidences star store. BSD-3,
    # pure-Python; dep delta vs the pre-proposal venv is scipy + tqdm only
    # (networkx/numpy/pandas were already present). Holds the higher-order
    # seat alongside igraph's dyadic-weighted seat (D17: both seats live).
    # Eval: doc/local/evaluations/hyper_graph_assessment.md.
    "hypergraphx",
    # Sparse all-pairs BFS for the longest-chains section of
    # helpers/graph/stats.py (direct import; was only a transitive
    # hypergraphx dep before 2026-09-13).
    "scipy",
    # Prefab UI (helpers/web/prefab_views.py — Python-composed Flask views,
    # prefab_ui_flask_views proposal 2026-09-11). Pinned EXACT despite the
    # repo's unpinned convention: pre-1.0 upstream allows breaking changes
    # per minor, so upgrades are deliberate slice-sized steps (proposal §5).
    # Pulls pydantic + cyclopts + rich (rich already present).
    "prefab-ui==0.20.2",
    # Bare, matching the repo's unpinned convention: uv.lock carries the
    # exact 0.25.0 resolution; the dependency-pinning advisory flags range
    # operators in [project].dependencies.
    "zstandard",
    # XXE/entity-safe XML parsing for the SHP/VIGIL RSS + XBRL lanes
    # (helpers/maintenance/shareholding_sync.py). Replaces the stdlib
    # xml.etree.ElementTree S314 exemptions — parser-level enforcement
    # instead of a content claim about external feeds (review of
    # b28991d54..c777fa9b1, operator-accepted 2026-10-11).
    "defusedxml",
    # Repo-wide JSON engine behind the helpers/core/jsonio.py shim (S0,
    # db_scaling_tuning.md §6.3): 1.55-1.6x stdlib on text parse, 2.5-2.7x with
    # -22% peak RSS on the `rb` mass lanes (81MB/pass session-JSONL corpus,
    # measured 2026-10-29, artifacts in bench notes). Converted call sites must
    # accept orjson's canonical compact UTF-8 output — dumps has no sort_keys
    # and returns bytes; diff-stable writers stay on stdlib json (see shim
    # docstring guardrails).
    "orjson",
]

[project.optional-dependencies]
# Dev tooling — lint / type-check / dependency audit.
dev = [
    "pytest",
    "pytest-cov",
    "pytest-xdist",
    "hypothesis",
    "ruff",
    "ty",
    "deptry",
]
# Textual TUI front door over the search indexes (helpers/misc/search_tui.py).
# Optional extra — `uv sync --extra tui`; without it the CLI prints install help.
tui = [
    "textual>=8.2",
    "rich>=15",
    # DbScreen SQL highlighting (TextArea language="sql").
    "tree-sitter",
    "tree-sitter-sql",
]
