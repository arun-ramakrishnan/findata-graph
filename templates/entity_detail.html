<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">Loading...</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='findata.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='entity_detail.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
    
    <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"
            integrity="sha384-/TQbtLCAerC3jgaim+N78RZSDYV7ryeoBCVqTuzRrFec2akfBkHS7ACQ3PQhvMVi"
            crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"
            integrity="sha384-+VfUPEb0PdtChMwmBcBmykRMDd+v6D/oFmB3rZM/puCMDYcIvF968OimRh4KQY9a"
            crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-core.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/plugins/autoloader/prism-autoloader.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
</head>
<body>
    <div class="entity-page">
        <!-- Header -->
        <header class="entity-header">
            <div class="entity-nav">
                <a href="/findata" class="back-link">
                    <i class="fas fa-arrow-left"></i>
                    Back to FinData
                </a>
                <div class="breadcrumb" id="breadcrumb">
                    <a href="/findata">FinData</a>
                    <span class="separator">/</span>
                    <span class="current" id="breadcrumb-current">Loading...</span>
                </div>
            </div>
            <div class="entity-actions">
                <button class="btn-secondary" id="toggle-toc" title="Toggle Table of Contents">
                    <i class="fas fa-list"></i>
                    <span>TOC</span>
                </button>
                <button class="btn-secondary" id="export-content" title="Export Content">
                    <i class="fas fa-download"></i>
                    <span>Export</span>
                </button>
                <button class="btn-secondary" id="print-content" title="Print">
                    <i class="fas fa-print"></i>
                    <span>Print</span>
                </button>
                <button class="btn-secondary" id="toggle-fullscreen" title="Toggle Fullscreen">
                    <i class="fas fa-expand"></i>
                    <span>Fullscreen</span>
                </button>
            </div>
        </header>

        <!-- Loading State -->
        <div id="loading-state" class="loading-state">
            <div class="loading-spinner">
                <i class="fas fa-spinner fa-spin"></i>
                <span>Loading entity details...</span>
            </div>
        </div>

        <!-- Error State -->
        <div id="error-state" class="error-state" style="display: none;">
            <div class="error-content">
                <i class="fas fa-exclamation-triangle"></i>
                <h3>Entity Not Found</h3>
                <p>The requested entity could not be found or may have been moved.</p>
                <a href="/findata" class="btn-primary">
                    <i class="fas fa-arrow-left"></i>
                    Back to FinData
                </a>
            </div>
        </div>

        <!-- Main Content -->
        <main id="main-content" class="entity-main" style="display: none;">
            <!-- Table of Contents Sidebar -->
            <aside id="toc-sidebar" class="toc-sidebar">
                <div class="toc-header">
                    <h3><i class="fas fa-list"></i> Table of Contents</h3>
                    <button class="toc-close" id="toc-close">
                        <i class="fas fa-times"></i>
                    </button>
                </div>
                <div id="toc-content" class="toc-content">
                    <!-- TOC will be generated here -->
                </div>
            </aside>

            <!-- Entity Content -->
            <article class="entity-article">
                <!-- Entity Metadata -->
                <header id="entity-metadata" class="entity-metadata">
                    <!-- Metadata will be loaded here -->
                </header>

                <!-- Entity Content -->
                <div id="entity-content" class="entity-content rich-content">
                    <!-- Content will be loaded here -->
                </div>
            </article>
        </main>

        <!-- Image Lightbox -->
        <div id="image-lightbox" class="lightbox" style="display: none;">
            <div class="lightbox-content">
                <button class="lightbox-close" id="close-lightbox">
                    <i class="fas fa-times"></i>
                </button>
                <img id="lightbox-image" src="" alt="">
                <div class="lightbox-caption"></div>
                <div class="lightbox-controls">
                    <button class="lightbox-btn" id="lightbox-prev">
                        <i class="fas fa-chevron-left"></i>
                    </button>
                    <button class="lightbox-btn" id="lightbox-next">
                        <i class="fas fa-chevron-right"></i>
                    </button>
                </div>
            </div>
        </div>

        <!-- Footer -->
        <footer class="entity-footer">
            <div class="footer-content">
                <p>&copy; 2025 FinData Knowledge Graph</p>
                <div class="footer-links">
                    <a href="/findata">
                        <i class="fas fa-chart-line"></i> Back to Explorer
                    </a>
                    <a href="https://github.com" target="_blank">
                        <i class="fab fa-github"></i>
                    </a>
                </div>
            </div>
        </footer>
    </div>

    <script src="{{ url_for('static', filename='entity_detail.js') }}"></script>
</body>
</html>
