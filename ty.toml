# ty type checker config — Astral (uv + ruff) stack (2026-08-13).
#
# ty is the type checker from the same authors as ruff/uv, so it shares the
# toolchain and config style. `make types` runs `ty check helpers app.py`.
#
# File selection:
#   make qa / make types  →  `ty check helpers app.py`  (gate-failing, production only)
#   make types-tests      →  `ty check tests --extra-search-path helpers …
#                             --config-file ty.tests.toml`  (non-gating; the
#                             make advisory ty-tests step calls this target —
#                             it is the single source of truth for the flags)
#
# Tests are excluded from the qa gate because they use sys.path.insert,
# monkeypatching, and mock proxies that ty cannot reason about statically.
# The advisory pipeline surfaces test type issues for visibility without
# blocking development. --extra-search-path helpers lets ty resolve the
# sys.path.insert(0, 'helpers') imports without per-line suppressions.
# [environment] pins python-version to the project interpreter (3.14) and points
# ty at the project .venv for third-party import resolution.

[environment]
python-version = "3.14"
python = ".venv"

# Bench/tooling code (helpers/bench/**) is not production code — it runs
# standalone benchmarks and probes. The sklearn import in hyper_community_probe.py
# is a Wall-4 ARI quality probe (bench tooling, not shipped). The transitive dep
# is not declared in [project].dependencies, so ty cannot resolve it. Downgrade
# to warn for bench files so real type bugs still surface.
[[overrides]]
include = ["helpers/bench/**"]

  [overrides.rules]
  unresolved-import = "warn"
